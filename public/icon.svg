<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d1111"/>
      <stop offset="70%" stop-color="#1a0606"/>
      <stop offset="100%" stop-color="#0d0202"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b38f00"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3300"/>
      <stop offset="35%" stop-color="#ff9933"/>
      <stop offset="75%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Halo Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8,6" stroke-opacity="0.6"/>

  <!-- Madhwa Gopichandana Mudra / Urdhva Pundra at top -->
  <g transform="translate(256, 120) scale(0.7)">
    <!-- White Chandana marks -->
    <path d="M -22 -40 L -22 10 Q -22 30 0 45 Q 22 30 22 10 L 22 -40 Q 12 -38 0 -38 Q -12 -38 -22 -40 Z" fill="#ffffff" opacity="0.95" />
    <path d="M -12 -35 L -12 10 Q -12 22 0 32 Q 12 22 12 10 L 12 -35 Z" fill="#1a0606" />
    <!-- Red Akshata line in middle -->
    <rect x="-3" y="-30" width="6" height="55" rx="3" fill="#ff1a1a" />
    <circle cx="0" cy="32" r="4" fill="#ff1a1a" />
  </g>

  <!-- Sacred Oil Lamp / Diya -->
  <!-- Base of Lamp -->
  <path d="M 176 380 L 336 380 C 320 395 310 410 256 415 C 202 410 192 395 176 380 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <ellipse cx="256" cy="415" rx="80" ry="12" fill="url(#goldGrad)" />
  
  <!-- Stem of Lamp -->
  <path d="M 244 330 L 268 330 L 264 380 L 248 380 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="340" r="14" fill="url(#goldGrad)" />

  <!-- Bowl of Lamp -->
  <path d="M 140 300 Q 256 360 372 300 Q 340 330 256 335 Q 172 330 140 300 Z" fill="url(#goldGrad)" />
  <ellipse cx="256" cy="300" rx="116" ry="24" fill="#663300" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Oil surface -->
  <ellipse cx="256" cy="301" rx="104" ry="16" fill="#b37700" opacity="0.8"/>

  <!-- Holy Flame -->
  <g filter="url(#glow)">
    <!-- Outer flame aura -->
    <path d="M 256 160 C 275 210 305 250 285 285 C 270 305 242 305 227 285 C 207 250 237 210 256 160 Z" fill="#ff6600" opacity="0.5" />
    <!-- Main Flame -->
    <path d="M 256 180 C 270 220 292 250 278 280 C 266 296 246 296 234 280 C 220 250 242 220 256 180 Z" fill="url(#flameGrad)" />
    <!-- Inner Core Flame -->
    <path d="M 256 225 C 264 245 272 260 266 276 C 260 286 252 286 246 276 C 240 260 248 245 256 225 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Holy Tulasi leaves flanking the lamp -->
  <g transform="translate(140, 310) rotate(-35) scale(0.6)">
    <path d="M 0 0 C -25 -40 0 -80 0 -80 C 0 -80 25 -40 0 0 Z" fill="#2d862d" stroke="#5cd65c" stroke-width="2"/>
    <path d="M 0 0 L 0 -70" stroke="#85e085" stroke-width="2"/>
    <path d="M -15 -35 C -35 -60 -20 -85 -20 -85 C -20 -85 0 -60 -15 -35 Z" fill="#236623" />
  </g>
  <g transform="translate(372, 310) rotate(35) scale(0.6)">
    <path d="M 0 0 C -25 -40 0 -80 0 -80 C 0 -80 25 -40 0 0 Z" fill="#2d862d" stroke="#5cd65c" stroke-width="2"/>
    <path d="M 0 0 L 0 -70" stroke="#85e085" stroke-width="2"/>
    <path d="M 15 -35 C 35 -60 20 -85 20 -85 C 20 -85 0 -60 15 -35 Z" fill="#236623" />
  </g>

  <!-- Sacred Kannada Akshara at bottom center -->
  <text x="256" y="470" font-family="'Noto Serif Kannada', serif" font-size="28" font-weight="bold" fill="#ffd700" text-anchor="middle" letter-spacing="4">॥ ಶ್ರೀ ಹರಿಃ ॥</text>
</svg>
